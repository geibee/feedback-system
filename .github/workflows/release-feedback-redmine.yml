name: Feedback Redmine release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: feedback-redmine-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 120
    steps:
      - name: Sourceを取得
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.jsを準備
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@geibee"
          cache: npm

      - name: Goを準備
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/feedback-service-go/go.sum

      - name: Trivyを準備
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.70.0
          cache: true

      - name: OCI公開toolを準備
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: Tagとpackage versionを検証
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/u.test(tag)) throw new Error(`release tagが不正です: ${tag}`);
          const version = tag.slice(1);
          const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (root.version !== version) throw new Error(`root versionがtagと一致しません: ${root.version}`);
          for (const workspace of root.workspaces) {
            const value = JSON.parse(fs.readFileSync(`${workspace}/package.json`, "utf8"));
            if (value.version !== version) throw new Error(`${workspace}のversionがtagと一致しません: ${value.version}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${version}\n`);
          NODE
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "同じtagのGitHub Releaseが既に存在します: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: 正規品質ゲート
        run: bash scripts/verify-feedback.sh

      - name: Release候補を生成
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir release
          bash scripts/build-feedback-redmine-release.sh --output release --version "$RELEASE_VERSION"

      - name: GitHub PackagesとGHCRへ公開
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: bash scripts/publish-feedback-redmine-release.sh --input release --version "$RELEASE_VERSION"

      - name: GitHub Releaseを作成
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --prerelease
