name: Feedback Redmine release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: feedback-redmine-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    steps:
      - name: Sourceを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node.jsを準備
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@geibee"
          package-manager-cache: false

      - name: Goを準備
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false

      - name: Trivyを準備
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.70.0
          cache: true

      - name: OCI公開toolを準備
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: Tagとpackage versionを検証
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/u.test(tag)) throw new Error(`release tagが不正です: ${tag}`);
          const version = tag.slice(1);
          const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (root.version !== version) throw new Error(`root versionがtagと一致しません: ${root.version}`);
          for (const workspace of root.workspaces) {
            const value = JSON.parse(fs.readFileSync(`${workspace}/package.json`, "utf8"));
            if (value.version !== version) throw new Error(`${workspace}のversionがtagと一致しません: ${value.version}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${version}\n`);
          NODE
      - name: 正規品質ゲート
        run: bash scripts/verify-feedback.sh

      - name: Release候補を生成
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir release
          bash scripts/build-feedback-redmine-release.sh --output release --version "$RELEASE_VERSION"

      - name: GitHub Release draftを準備
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          release_json="$RUNNER_TEMP/feedback-release.json"
          release_error="$RUNNER_TEMP/feedback-release.err"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >"$release_json" 2>"$release_error"; then
            jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == true' "$release_json" >/dev/null || {
              echo "同じtagの公開済みReleaseが既に存在します: $RELEASE_TAG" >&2
              exit 1
            }
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            if ! grep -q 'HTTP 404' "$release_error"; then
              cat "$release_error" >&2
              echo "GitHub Releaseの存在確認に失敗しました" >&2
              exit 1
            fi
            release_flags=(--draft --verify-tag --generate-notes)
            if [[ "$RELEASE_VERSION" == *-* ]]; then release_flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" release/* "${release_flags[@]}"
          fi

      - name: GitHub PackagesとGHCRへ公開
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: bash scripts/publish-feedback-redmine-release.sh --input release --version "$RELEASE_VERSION"

      - name: GitHub Releaseを公開
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false
          fi
