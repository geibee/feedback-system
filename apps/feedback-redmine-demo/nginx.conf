worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr notice;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /health { access_log off; return 200 '{"status":"ok"}\n'; add_header Content-Type application/json; }
    location = /.well-known/feedback-redmine.json { add_header Cache-Control "no-store" always; try_files $uri =404; }
    location /internal/feedback-redmine/v1/ {
      proxy_pass http://feedback-redmine-gateway:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_request_buffering off;
      proxy_read_timeout 65s;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
